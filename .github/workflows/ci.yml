name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:android
      - run: npm run export:ios
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: dotnet build services/api/Tripora.Api.csproj --configuration Release
      - run: node tests/e2e/api-health.mjs
      - run: npm ci --prefix apps/mobile
      - run: npm test --prefix apps/mobile
      - run: npm ci --prefix tests/e2e
      - run: node --test tests/e2e/local-backup.test.mjs
      - run: node --experimental-sqlite tests/e2e/auth-sync.mjs
